<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumen demo — home</title>
<link rel="stylesheet" href="ui.css">
</head>
<body class="home">
<main class="screen">
  <div class="statusbar">
    <span>9:41</span>
    <span class="status-icons">
      <span class="bars"><i></i><i></i><i></i><i></i></span>
      <svg class="wifi" viewBox="0 0 24 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M2 6.5a15 15 0 0 1 20 0"/><path d="M5.5 10.5a10 10 0 0 1 13 0"/><path d="M9 14.5a5 5 0 0 1 6 0"/>
        <circle cx="12" cy="17.5" r="1" fill="currentColor" stroke="none"/>
      </svg>
      <span class="battery"></span>
    </span>
  </div>

  <section class="top">
    <p class="kicker">Monday, 24 November</p>
    <h1>Good morning,<br>Mia.</h1>
    <p class="lede">You have <b>2 sessions</b> planned today.</p>
  </section>

  <section class="ring-card">
    <div class="ring">
      <div class="ring-inner">
        <span class="ring-num">42</span>
        <span class="ring-unit">minutes today</span>
      </div>
    </div>
    <div class="ring-meta"><span>Daily goal <b>90 min</b></span><span>47%</span></div>
  </section>

  <button class="primary">Start a focus session <span>→</span></button>

  <section class="quick">
    <div class="quick-card">
      <span class="dot deep"></span>
      <div><b>Deep work</b><small>25 min · notifications off</small></div>
      <span class="chev">›</span>
    </div>
    <div class="quick-card">
      <span class="dot read"></span>
      <div><b>Read</b><small>15 min · ambient rain</small></div>
      <span class="chev">›</span>
    </div>
  </section>

  <section class="quote-card">
    <p>“Almost everything will work again if you unplug it for a few minutes.”</p>
  </section>

  <nav class="tabbar">
    <div class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      <span>Today</span>
    </div>
    <div>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>Timer</span>
    </div>
    <div>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Insights</span>
    </div>
    <div>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
      <span>You</span>
    </div>
  </nav>
</main>
</body>
</html>
