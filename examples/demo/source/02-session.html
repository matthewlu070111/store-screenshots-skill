<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumen demo — session</title>
<link rel="stylesheet" href="ui.css">
</head>
<body class="session">
<main class="screen">
  <div class="statusbar">
    <span>9:41</span>
    <span class="status-icons">
      <span class="bars"><i></i><i></i><i></i><i></i></span>
      <svg class="wifi" viewBox="0 0 24 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M2 6.5a15 15 0 0 1 20 0"/><path d="M5.5 10.5a10 10 0 0 1 13 0"/><path d="M9 14.5a5 5 0 0 1 6 0"/>
        <circle cx="12" cy="17.5" r="1" fill="currentColor" stroke="none"/>
      </svg>
      <span class="battery"></span>
    </span>
  </div>

  <div class="session-top">
    <span class="ghost">‹</span>
    <span>Deep work</span>
    <span class="ghost">···</span>
  </div>

  <div class="timer-wrap">
    <div class="timer">
      <span class="clock">24:18</span>
      <span class="timer-label">remaining</span>
    </div>
  </div>

  <p class="intention">“Finish the launch copy<br>before lunch.”</p>

  <div class="wave">
    <i style="height:18%"></i><i style="height:34%"></i><i style="height:26%"></i>
    <i style="height:58%"></i><i style="height:76%"></i><i style="height:44%"></i>
    <i style="height:92%"></i><i style="height:62%"></i><i style="height:38%"></i>
    <i style="height:70%"></i><i style="height:50%"></i><i style="height:30%"></i>
    <i style="height:22%"></i>
  </div>

  <div class="controls">
    <span class="round">↺</span>
    <span class="round big">Ⅱ</span>
    <span class="round">✕</span>
  </div>

  <div class="chips">
    <span>Rain</span>
    <span>25 minutes</span>
    <span>Do not disturb</span>
  </div>
</main>
</body>
</html>
