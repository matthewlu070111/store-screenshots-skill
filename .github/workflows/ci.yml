name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["18.20", "20", "22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Repository checks
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

  integration:
    name: Render and verify demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check browser
        run: google-chrome --version || chromium --version

      - name: Integration tests
        run: npm run test:integration

      - name: Generate demo
        run: npm run demo

      - name: Verify demo
        run: npm run verify -- examples/demo/out

      - name: Upload demo output
        uses: actions/upload-artifact@v4
        with:
          name: demo-screenshots
          path: examples/demo/out
          if-no-files-found: error
          retention-days: 7
